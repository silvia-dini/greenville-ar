<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- White background required for AR marker -->
  <rect width="400" height="400" fill="white"/>
  
  <!-- Black border frame -->
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="black" stroke-width="8"/>
  
  <!-- QR-like corner squares (required for MindAR detection) -->
  <!-- Top-left -->
  <rect x="25" y="25" width="90" height="90" fill="black"/>
  <rect x="38" y="38" width="64" height="64" fill="white"/>
  <rect x="51" y="51" width="38" height="38" fill="black"/>
  
  <!-- Top-right -->
  <rect x="285" y="25" width="90" height="90" fill="black"/>
  <rect x="298" y="38" width="64" height="64" fill="white"/>
  <rect x="311" y="51" width="38" height="38" fill="black"/>
  
  <!-- Bottom-left -->
  <rect x="25" y="285" width="90" height="90" fill="black"/>
  <rect x="38" y="298" width="64" height="64" fill="white"/>
  <rect x="51" y="311" width="38" height="38" fill="black"/>

  <!-- Center logo area -->
  <rect x="130" y="130" width="140" height="140" fill="black" rx="8"/>
  <rect x="138" y="138" width="124" height="124" fill="white" rx="4"/>
  
  <!-- G letter -->
  <text x="200" y="218" font-family="Georgia,serif" font-size="72" font-weight="bold" 
        text-anchor="middle" fill="black">G</text>
  
  <!-- Random data dots pattern (helps MindAR track) -->
  <!-- Row 1 -->
  <rect x="130" y="30" width="14" height="14" fill="black"/>
  <rect x="158" y="30" width="14" height="14" fill="black"/>
  <rect x="200" y="30" width="14" height="14" fill="black"/>
  <rect x="228" y="30" width="14" height="14" fill="black"/>
  <rect x="256" y="30" width="14" height="14" fill="black"/>
  <!-- Row 2 -->
  <rect x="144" y="58" width="14" height="14" fill="black"/>
  <rect x="186" y="58" width="14" height="14" fill="black"/>
  <rect x="214" y="58" width="14" height="14" fill="black"/>
  <rect x="242" y="58" width="14" height="14" fill="black"/>
  <!-- Row 3 -->
  <rect x="130" y="86" width="14" height="14" fill="black"/>
  <rect x="172" y="86" width="14" height="14" fill="black"/>
  <rect x="228" y="86" width="14" height="14" fill="black"/>
  <rect x="256" y="86" width="14" height="14" fill="black"/>
  <!-- Left column -->
  <rect x="30" y="130" width="14" height="14" fill="black"/>
  <rect x="30" y="158" width="14" height="14" fill="black"/>
  <rect x="30" y="200" width="14" height="14" fill="black"/>
  <rect x="30" y="228" width="14" height="14" fill="black"/>
  <rect x="30" y="256" width="14" height="14" fill="black"/>
  <!-- Right column -->
  <rect x="356" y="130" width="14" height="14" fill="black"/>
  <rect x="356" y="158" width="14" height="14" fill="black"/>
  <rect x="356" y="200" width="14" height="14" fill="black"/>
  <rect x="356" y="228" width="14" height="14" fill="black"/>
  <rect x="356" y="256" width="14" height="14" fill="black"/>
  <!-- Bottom row -->
  <rect x="130" y="356" width="14" height="14" fill="black"/>
  <rect x="172" y="356" width="14" height="14" fill="black"/>
  <rect x="200" y="356" width="14" height="14" fill="black"/>
  <rect x="242" y="356" width="14" height="14" fill="black"/>
  <rect x="270" y="356" width="14" height="14" fill="black"/>
  <!-- Bottom-right area dots -->
  <rect x="285" y="200" width="14" height="14" fill="black"/>
  <rect x="313" y="186" width="14" height="14" fill="black"/>
  <rect x="327" y="214" width="14" height="14" fill="black"/>
  <rect x="285" y="242" width="14" height="14" fill="black"/>
  <rect x="313" y="256" width="14" height="14" fill="black"/>

  <!-- Label -->
  <text x="200" y="390" font-family="Arial,sans-serif" font-size="11" 
        text-anchor="middle" fill="#333">GreenVille Estate · AR Marker</text>
</svg>
