<svg xmlns="http://www.w3.org/2000/svg" width="500" height="650" viewBox="0 0 500 650">
  <rect width="500" height="650" fill="white"/>
  
  <!-- Title -->
  <text x="250" y="35" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">GreenVille Estate · AR Marker</text>
  <text x="250" y="55" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#666">Cetak halaman ini · Scan dengan HP di ar.html</text>
  
  <!-- Hiro Marker (standard AR.js marker) -->
  <!-- Outer black border -->
  <rect x="50" y="70" width="400" height="400" fill="black"/>
  <!-- White padding -->
  <rect x="80" y="100" width="340" height="340" fill="white"/>
  <!-- Inner black area -->
  <rect x="110" y="130" width="280" height="280" fill="black"/>
  
  <!-- Hiro pattern (simplified version that AR.js recognizes) -->
  <!-- Top row -->
  <rect x="130" y="150" width="40" height="40" fill="white"/>
  <rect x="230" y="150" width="40" height="40" fill="white"/>
  <rect x="330" y="150" width="40" height="40" fill="white"/>
  <!-- Middle row -->
  <rect x="130" y="230" width="40" height="40" fill="white"/>
  <rect x="230" y="230" width="40" height="60" fill="white"/>
  <rect x="330" y="230" width="40" height="40" fill="white"/>
  <!-- Bottom row -->
  <rect x="130" y="330" width="40" height="40" fill="white"/>
  <rect x="230" y="330" width="40" height="40" fill="white"/>
  <rect x="330" y="330" width="40" height="40" fill="white"/>

  <!-- Label di dalam marker -->
  <text x="250" y="510" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">🏠 GreenVille Estate</text>
  
  <!-- Divider -->
  <line x1="50" y1="530" x2="450" y2="530" stroke="#ddd" stroke-width="1"/>
  
  <!-- Instructions -->
  <text x="250" y="555" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#555">Cara pakai:</text>
  <text x="250" y="575" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#777">1. Buka ar.html di HP</text>
  <text x="250" y="592" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#777">2. Tap "Aktifkan Kamera AR"</text>
  <text x="250" y="609" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#777">3. Arahkan kamera ke kotak hitam di atas</text>
  <text x="250" y="626" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#777">4. Model 3D akan muncul! ✨</text>
  
  <!-- URL reminder -->
  <text x="250" y="645" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#aaa">silvia-dini.github.io/greenville-ar/ar.html</text>
</svg>
